<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<title>Flick</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="table"></canvas>

    <div id="hud">
      <span id="hud-level">Level 1</span>
      <span id="hud-attempts" class="hidden"></span>
      <span id="hud-streak">Streak 0 &middot; Best 0</span>
    </div>

    <div id="overlay-start" class="overlay">
      <h1>Flick</h1>
      <p>Swipe up to launch the puck into the goal.</p>
      <p class="hint">Tap to begin</p>
    </div>

    <div id="overlay-failed" class="overlay hidden">
      <p id="failed-text">Missed</p>
      <p class="hint">Tap to retry</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
